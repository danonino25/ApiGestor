spring.application.name=Ejercicio5MyAPIGestor

# Puerto: en la nube lo inyecta la plataforma (PORT); en local usa 8081
server.port=${PORT:8081}

# ===== Conexion a BD (sin credenciales en el codigo) =====
# DATABASE_URL debe ir en formato JDBC, por ejemplo:
#   local : jdbc:mariadb://localhost:3306/dbgestor
#   Aiven : jdbc:mysql://<host>:<puerto>/defaultdb?sslMode=REQUIRED
# El driver (MariaDB o MySQL) se detecta automaticamente por el prefijo de la URL.
spring.datasource.url=${DATABASE_URL:jdbc:mariadb://localhost:3306/dbgestor?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Pool pequeno: las BD gratuitas limitan el numero de conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ===== JPA / Hibernate =====
# Sin dialecto fijo: Hibernate lo detecta segun el servidor (MariaDB o MySQL)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
